name: Auto-assign bug issues to Copilot

on:
  issues:
    types: [labeled]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'bug-fix'
    
    steps:
      - name: Assign to Copilot
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-assignee copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}  # Use PAT instead of GITHUB_TOKEN
      
      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_TOKEN }}  # Use PAT here too
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 **Copilot has been assigned to this issue!**\n\n' +
                    'Copilot will analyze the issue and create a pull request automatically.\n\n' +
                    '**Expected timeline:**\n' +
                    '- Next few minutes: Copilot analyzes the issue 👀\n' +
                    '- Within 5-10 minutes: Pull request is created 📝\n\n' +
                    'You can track progress by watching for reactions and comments from Copilot.'
            });