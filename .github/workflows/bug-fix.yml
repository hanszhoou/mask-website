name: Copilot Assignment Reminder

on:
  issues:
    types: [labeled]

jobs:
  remind-copilot:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'bug-fix'
    
    steps:
      - name: Add reminder comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 **Bug fix issue detected!**\n\n' +
                    '**To have Copilot create a PR automatically:**\n' +
                    '1. Click **Assignees** on the right sidebar →\n' +
                    '2. Select **@copilot** from the dropdown\n' +
                    '3. Copilot will analyze and create a PR within 5 minutes\n\n' +
                    '💡 **Tip:** You can also use Copilot in your IDE to help fix this issue!'
            });